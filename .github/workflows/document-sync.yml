name: Document sync

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test document conversion and drift detection
        run: python -m unittest discover -s tests -v
      - name: Check all DOCX and Markdown pairs
        run: python scripts/sync_documents.py --check
      - name: Check reviewed PDFs and other reading copies
        run: python scripts/check_reading_copies.py --check
      - name: Check complete lesson sets and embedded speaker notes
        run: python scripts/check_lesson_materials.py
